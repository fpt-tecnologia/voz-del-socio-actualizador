name: Actualizar dashboard Voz del Socio
on:
  schedule:
    - cron: '41 16,21 * * 1-5'   # 10:41 y 15:41 en CDMX, lunes a viernes
  workflow_dispatch: {}          # botón "Actualizar ahora" del dashboard y ejecución manual
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  actualizar:
    # El horario solo corre cuando la variable ACTIVO = si (se activa al terminar la configuración)
    if: github.event_name != 'schedule' || vars.ACTIVO == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --omit=optional
      - run: npm run actualizar
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          SENTIONE_KEY: ${{ secrets.SENTIONE_KEY }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          MAILBOX: ${{ vars.MAILBOX }}
          AXOL_FROM: ${{ vars.AXOL_FROM }}
          REDES_FROM: ${{ vars.REDES_FROM }}
          ALERTAS_MAILBOX: ${{ vars.ALERTAS_MAILBOX }}
          SP_HOST: ${{ vars.SP_HOST }}
          SP_SITE: ${{ vars.SP_SITE }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
